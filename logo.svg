<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <!-- Accent Cyan Gradient -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <!-- Gold Spark Gradient -->
    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Subtle Border -->
  <rect x="6" y="6" width="108" height="108" rx="30" fill="url(#logoBgGrad)" />
  <rect x="6.75" y="6.75" width="106.5" height="106.5" rx="29.25" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Background Tech Circuit Grid -->
  <path d="M26 36L44 36M76 36L94 36M26 84L40 84M80 84L94 84" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-linecap="round" />
  <circle cx="44" cy="36" r="2.5" fill="rgba(56,189,248,0.3)" />
  <circle cx="76" cy="36" r="2.5" fill="rgba(56,189,248,0.3)" />

  <!-- Graduation Cap Top (Diamond Plinth) -->
  <path d="M60 28L96 46L60 64L24 46L60 28Z" fill="#ffffff" />
  
  <!-- Subtle 3D Cap Shading -->
  <path d="M60 64L96 46L60 28" fill="rgba(0,0,0,0.06)" />

  <!-- Cap Skull Base -->
  <path d="M38 53.5V70C38 78 48 84 60 84C72 84 82 78 82 70V53.5L60 64.5L38 53.5Z" fill="#f8fafc" />

  <!-- Code Symbol Accent </> in Front of Cap -->
  <path d="M49 66L43 71L49 76" stroke="url(#cyanAccent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M71 66L77 71L71 76" stroke="url(#cyanAccent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M63 64L57 78" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cap Tassel with Gold Spark -->
  <path d="M96 46V68" stroke="url(#goldSpark)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="96" cy="72" r="4.5" fill="url(#goldSpark)" filter="url(#softGlow)" />

  <!-- Top Star / Innovation Sparkle -->
  <path d="M60 19L62.2 24.5L68 25.2L63.5 28.8L65 34.5L60 31.4L55 34.5L56.5 28.8L52 25.2L57.8 24.5L60 19Z" fill="url(#goldSpark)" />
</svg>
